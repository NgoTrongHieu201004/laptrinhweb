<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách người dùng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .navbar {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .navbar a {
            text-decoration: none;
            margin: 0 10px;
            color: black;
            font-weight: bold;
        }
        .user-table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        .user-table th, .user-table td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        .user-table th {
            background-color: #f2f2f2;
        }
        .actions a {
            margin: 0 5px;
            text-decoration: none;
            color: blue;
        }
        .actions a:hover {
            text-decoration: underline;
        }
        .pagination {
            margin: 20px;
        }
        .pagination a {
            text-decoration: none;
            padding: 8px 12px;
            border: 1px solid #000;
            margin: 0 3px;
            display: inline-block;
            border-radius: 5px;
            color: black;
        }
        .pagination a:hover {
            background-color: #ddd;
        }
        .footer {
            margin-top: 30px;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
