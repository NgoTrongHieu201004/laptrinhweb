<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .navbar {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .navbar a {
            text-decoration: none;
            margin: 0 10px;
            color: black;
            font-weight: bold;
        }
        .detail-box {
            width: 40%;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #000;
            border-radius: 10px;
            text-align: left;
            background-color: #f9f9f9;
        }
        .detail-box h2 {
            text-align: center;
        }
        .detail-box p {
            font-size: 18px;
            margin: 10px 0;
        }
        .detail-box span {
            font-weight: bold;
        }
        .edit-button {
            display: block;
            width: 150px;
            padding: 10px;
            margin: 20px auto;
            background-color: #007bff;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .edit-button:hover {
            background-color: #0056b3;
        }
        .footer {
            margin-top: 30px;
            padding: 10px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">Home</a> | 
        <a href="#">Đăng xuất</a>
    </div>

    <div class="detail-box">
        <h2>Màn hình chi tiết</h2>
        <p>Username: <span>test1</span></p>
        <p>Email: <span>test1@gmail.com</span></p>
        <a href="#" class="edit-button">Chỉnh sửa</a>
    </div>

    <div class="footer">
        Lập trình web @01/2024
    </div>

</body>
</html>
